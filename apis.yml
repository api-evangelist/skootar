aid: skootar
name: Skootar
description: >-
  Skootar is a Thai on-demand courier, messenger, and logistics platform serving
  Bangkok, its surrounding provinces, and Chonburi. It offers same-day document
  delivery, cheque and bill collection, parcel shipping, business food delivery,
  and on-demand pickup-truck and moving jobs across a fleet of motorcycles, cars,
  and trucks, all with real-time tracking. Orders can be placed 24/7 through the
  website, the mobile app, or an API intended for high-volume businesses to wire
  delivery ordering into their own back-office systems. Skootar reports more than
  130,000 business customers, 26,000+ drivers, and 9.2 million+ completed
  deliveries over 12 years, and is backed by 500 Global. No public developer
  portal, OpenAPI specification, or SDK is published; API access is arranged
  through its business/enterprise channel.
